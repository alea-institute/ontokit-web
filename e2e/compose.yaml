# All substitutions come from the private generated runtime.env, never developer .env.
x-labels: &labels
  io.ontokit.e2e.run: ${RUN_ID:?}
x-api: &api
  image: ${PROJECT:?}/api:run
  labels: *labels
  environment: &api-env
    APP_ENV: staging
    DEBUG: "false"
    RUN_MIGRATIONS: "0"
    AUTH_MODE: required
    SECRET_KEY: ${APP_SECRET:?}
    DATABASE_URL: postgresql+asyncpg://ontokit:${APP_DB_PASSWORD:?}@postgres:5432/ontokit
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_USER:?}
    MINIO_SECRET_KEY: ${MINIO_PASSWORD:?}
    MINIO_BUCKET: ontokit
    MINIO_SECURE: "false"
    GIT_REPOS_BASE_PATH: /data/repos
    ZITADEL_ISSUER: http://localhost:${IDENTITY_PORT:?}
    ZITADEL_INTERNAL_URL: http://zitadel:${IDENTITY_PORT:?}
    ZITADEL_CLIENT_ID: ${OIDC_CLIENT_ID:-unconfigured}
    SUPERADMIN_USER_IDS: ""
    CORS_ORIGINS: '["http://localhost:${WEB_PORT:?}"]'
    FRONTEND_URL: http://localhost:${WEB_PORT:?}
  volumes: [git:/data/repos]
  networks: [data, ingress]
services:
  postgres:
    image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    labels: *labels
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      ZITADEL_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      ONTOKIT_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes: [postgres:/var/lib/postgresql/data, "./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro"]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    labels: *labels
    networks: [data]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    labels: *labels
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?}
    networks: [data]
    volumes: [minio:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 3s
      retries: 60
  zitadel:
    image: ghcr.io/zitadel/zitadel@sha256:f3738fd984131d3f02e386d37fa480d1a30e42b7d4202e2b322f12f7cf556b64
    labels: *labels
    user: "0"
    command: [start-from-init, --masterkey, "${IDENTITY_MASTERKEY:?}", --tlsMode, disabled]
    environment:
      ZITADEL_PORT: ${IDENTITY_PORT:?}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${IDENTITY_PORT:?}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-data/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_NAME: OntoKit isolated tests
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Disposable bootstrap administrator
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${IDENTITY_PAT_EXPIRY:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: bootstrap-human
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: bootstrap@example.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-data/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Disposable Login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${IDENTITY_PAT_EXPIRY:?}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${LOGIN_PORT:?}/ui/v2/login
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${LOGIN_PORT:?}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${LOGIN_PORT:?}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:${LOGIN_PORT:?}/ui/v2/login/login?samlRequest=
    ports: ["127.0.0.1:${IDENTITY_PORT:?}:${IDENTITY_PORT:?}", "127.0.0.1:${LOGIN_PORT:?}:${LOGIN_PORT:?}"]
    volumes: [identity:/zitadel-data]
    networks: [data, ingress]
  login:
    image: ghcr.io/zitadel/zitadel-login@sha256:7c210b79ae78ae74d76092154fa664601852ce79675a747a1085c2656b195648
    labels: *labels
    user: "0"
    # This pinned Login image requires the token VALUE, not a _FILE setting.
    entrypoint: [/bin/sh, -c, 'export ZITADEL_SERVICE_USER_TOKEN=$$(cat /zitadel-data/login-client.pat) && exec /app/entrypoint.sh node apps/login/server.js']
    environment:
      ZITADEL_API_URL: http://localhost:${IDENTITY_PORT:?}
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      PORT: ${LOGIN_PORT:?}
      HOSTNAME: 0.0.0.0
      EMAIL_VERIFICATION: "true"
    network_mode: service:zitadel
    volumes: [identity:/zitadel-data:ro]
  api:
    <<: *api
    build:
      context: ./api
      labels:
        <<: *labels
        com.docker.compose.project: ${PROJECT:?}
    command: [uvicorn, ontokit.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${API_PORT:?}:8000"]
  migrate:
    <<: *api
    command: [python, -m, alembic, upgrade, heads]
  worker:
    <<: *api
    command: [arq, ontokit.worker.WorkerSettings]
    healthcheck:
      disable: true
networks:
  data:
    internal: true
    labels: *labels
  ingress:
    labels: *labels
volumes:
  postgres:
    labels: *labels
  redis:
    labels: *labels
  minio:
    labels: *labels
  git:
    labels: *labels
  identity:
    labels: *labels
